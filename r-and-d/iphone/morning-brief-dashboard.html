<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- ── iOS Web App: makes it feel native when launched from Home Screen ── -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Morning Brief" />
  <meta name="theme-color" content="#0d1117" />

  <!-- ── App icon shown when user taps "Add to Home Screen" ── -->
  <!-- A 180×180 orange "FK" icon encoded as SVG/base64 -->
  <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIj48cmVjdCB3aWR0aD0iMTgwIiBoZWlnaHQ9IjE4MCIgcng9IjQwIiBmaWxsPSIjMGQxMTE3Ii8+PHRleHQgeD0iOTAiIHk9IjExNSIgZm9udC1mYW1pbHk9Ii1hcHBsZS1zeXN0ZW0sc2Fucy1zZXJpZiIgZm9udC1zaXplPSI3MiIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iI2YwODgzZSIgdGV4dC1hbmNob3I9Im1pZGRsZSI+Rks8L3RleHQ+PC9zdmc+" />

  <title>Morning Brief — Fortune's Kitchen</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      /* Safe-area insets for notch / Dynamic Island / home indicator */
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
      padding-top: max(env(safe-area-inset-top, 0px), 20px);
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 20px);
      padding-left: 16px;
      padding-right: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f0883e;
    }

    #clock {
      font-size: 0.9rem;
      color: #8b949e;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 16px;
      /* Subtle tap highlight */
      -webkit-tap-highlight-color: transparent;
    }

    .card.full { grid-column: span 2; }

    .card h2 {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .card .value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f0883e;
    }

    .card .sub {
      font-size: 0.75rem;
      color: #8b949e;
      margin-top: 2px;
    }

    /* Weather */
    #weather-icon { font-size: 2.4rem; line-height: 1; }
    #weather-desc { font-size: 0.85rem; margin-top: 4px; color: #c9d1d9; }

    /* Calendar */
    #cal-list { list-style: none; }
    #cal-list li {
      font-size: 0.85rem;
      padding: 7px 0;
      border-bottom: 1px solid #21262d;
      color: #c9d1d9;
    }
    #cal-list li:last-child { border-bottom: none; }
    #cal-list .time { color: #f0883e; font-weight: 600; margin-right: 6px; }

    /* Email */
    #email-count { font-size: 1.6rem; font-weight: 700; color: #58a6ff; }

    /* GitHub */
    #github-issues { font-size: 1.6rem; font-weight: 700; color: #3fb950; }

    /* AI Summary */
    #ai-summary {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #c9d1d9;
      background: #0d1117;
      border-radius: 10px;
      padding: 12px;
      min-height: 64px;
    }

    /* Refresh button — large tap target */
    #refresh-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      background: #f0883e;
      color: #0d1117;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #refresh-btn:active { opacity: 0.75; transform: scale(0.98); }

    .loading { color: #8b949e; font-style: italic; }

    /* ── Setup banner ── */
    #config-banner {
      background: #161b22;
      border: 1px dashed #f0883e;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      color: #c9d1d9;
      font-size: 0.85rem;
    }
    #config-banner strong { color: #f0883e; }
    #config-banner a { color: #58a6ff; }

    #webhook-url-input {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      color: #e6edf3;
      font-size: 0.85rem;
      /* Prevent iOS zoom on focus (font-size must be >= 16px to avoid zoom) */
      font-size: 16px;
    }

    #save-webhook-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      background: #58a6ff;
      color: #0d1117;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    #edit-webhook-btn {
      background: none;
      border: none;
      color: #8b949e;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 4px 0;
      margin-top: 8px;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<header>
  <h1>☀️ Morning Brief</h1>
  <span id="clock"></span>
</header>

<!-- Setup banner — hidden once webhook is saved -->
<div id="config-banner">
  <strong>One-time setup:</strong> Paste your n8n webhook URL and tap Save.<br/>
  <a href="https://app.n8n.cloud/kmo1960" target="_blank">Open n8n to get the URL →</a>
  <input id="webhook-url-input" type="url" inputmode="url" autocomplete="url"
         placeholder="https://app.n8n.cloud/kmo1960/webhook/..." />
  <button id="save-webhook-btn">💾 Save &amp; Load Brief</button>
</div>

<!-- Edit webhook link shown after setup -->
<div id="edit-webhook-wrap" style="display:none; text-align:right;">
  <button id="edit-webhook-btn">⚙️ Change webhook URL</button>
</div>

<div class="grid">

  <!-- Date -->
  <div class="card">
    <h2>📅 Today</h2>
    <div class="value" id="date-day">—</div>
    <div class="sub" id="date-full"></div>
  </div>

  <!-- Weather -->
  <div class="card">
    <h2>🌤 La Quinta</h2>
    <div id="weather-icon">—</div>
    <div id="weather-desc" class="loading">–</div>
  </div>

  <!-- Email -->
  <div class="card">
    <h2>📧 Unread Email</h2>
    <div id="email-count" class="loading">—</div>
    <div class="sub">Gmail inbox</div>
  </div>

  <!-- GitHub -->
  <div class="card">
    <h2>🐙 GitHub</h2>
    <div id="github-issues" class="loading">—</div>
    <div class="sub" id="github-sub">Open issues</div>
  </div>

  <!-- Calendar -->
  <div class="card full">
    <h2>📆 Today's Schedule</h2>
    <ul id="cal-list"><li class="loading">–</li></ul>
  </div>

  <!-- AI Summary -->
  <div class="card full">
    <h2>🤖 AI Summary</h2>
    <div id="ai-summary" class="loading">Tap Refresh to load your brief.</div>
  </div>

</div>

<button id="refresh-btn">🔄 Refresh Brief</button>

<script>
  /* ── Clock ── */
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  }
  setInterval(updateClock, 1000);
  updateClock();

  /* ── Date ── */
  function updateDate() {
    const now = new Date();
    document.getElementById('date-day').textContent =
      now.toLocaleDateString('en-US', { weekday: 'short' });
    document.getElementById('date-full').textContent =
      now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }
  updateDate();

  /* ── Webhook config ── */
  const STORAGE_KEY = 'morning_brief_webhook';

  function getWebhookUrl() {
    return localStorage.getItem(STORAGE_KEY) || '';
  }

  function showBanner() {
    document.getElementById('config-banner').style.display = 'block';
    document.getElementById('edit-webhook-wrap').style.display = 'none';
  }

  function hideBanner() {
    document.getElementById('config-banner').style.display = 'none';
    document.getElementById('edit-webhook-wrap').style.display = 'block';
  }

  function initConfig() {
    const saved = getWebhookUrl();
    if (saved) {
      document.getElementById('webhook-url-input').value = saved;
      hideBanner();
    }

    document.getElementById('save-webhook-btn').addEventListener('click', () => {
      const val = document.getElementById('webhook-url-input').value.trim();
      if (val) {
        localStorage.setItem(STORAGE_KEY, val);
        hideBanner();
        loadBrief();
      }
    });

    document.getElementById('edit-webhook-btn').addEventListener('click', () => {
      showBanner();
    });
  }

  /* ── Load brief from n8n webhook ── */
  async function loadBrief() {
    const url = getWebhookUrl();
    if (!url) return;

    // Show loading states
    ['email-count', 'github-issues', 'ai-summary'].forEach(id => {
      document.getElementById(id).textContent = '…';
    });
    document.getElementById('cal-list').innerHTML = '<li class="loading">Loading…</li>';
    document.getElementById('weather-desc').textContent = 'Loading…';
    document.getElementById('weather-icon').textContent = '—';

    try {
      const res = await fetch(url, {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      /* Expected n8n response shape:
        {
          weather: { icon: "☀️", description: "82°F, Sunny" },
          email:   { unread: 5 },
          github:  { open_issues: 3, open_prs: 0 },
          calendar: [
            { time: "9:00 AM", title: "Staff Meeting" },
            ...
          ],
          summary: "Good morning Keith! You have 3 meetings and 5 unread emails. Focus: staff payroll today."
        }
      */

      if (data.weather) {
        document.getElementById('weather-icon').textContent = data.weather.icon || '🌤';
        document.getElementById('weather-desc').textContent = data.weather.description || '';
      }

      if (data.email) {
        document.getElementById('email-count').textContent = data.email.unread ?? '—';
      }

      if (data.github) {
        document.getElementById('github-issues').textContent = data.github.open_issues ?? '—';
        document.getElementById('github-sub').textContent =
          `${data.github.open_prs ?? 0} open PRs`;
      }

      if (data.calendar && data.calendar.length > 0) {
        document.getElementById('cal-list').innerHTML = data.calendar
          .map(e => `<li><span class="time">${e.time}</span>${e.title}</li>`)
          .join('');
      } else {
        document.getElementById('cal-list').innerHTML = '<li>No events today 🎉</li>';
      }

      if (data.summary) {
        document.getElementById('ai-summary').textContent = data.summary;
        document.getElementById('ai-summary').classList.remove('loading');
      }

    } catch (err) {
      document.getElementById('ai-summary').textContent =
        `⚠️ Could not reach n8n webhook. ${err.message}`;
      document.getElementById('ai-summary').classList.add('loading');
    }
  }

  /* ── Init ── */
  initConfig();
  if (getWebhookUrl()) loadBrief();

  document.getElementById('refresh-btn').addEventListener('click', loadBrief);
</script>

</body>
</html>
